version: '3.8'
services:
  web:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
  app:
    image: node:20-alpine
    environment:
      - NODE_ENV=production
    command: ["node", "server.js"]
  cache:
    image: redis:7-alpine
    ports:
      - "6379:6379"
